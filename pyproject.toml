[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-swarm"
version = "1.0.0"
description = "Deterministic multi-agent orchestration framework for LLM environments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
